<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="menu.css">
    <title>Menu</title>
</head>

<body>
    <main id="comp-mbilnugd5">
        <div class="outter-icons-container">
            <div class="info-cards-container">
                <div class="info-card">
                    <img src="placeholder-icon-1.svg" alt="Card Icon 1">
                    <p class="card-description">
                        Clique em Catálogo virtual para ter acesso aos preços e informações de alguns produtos especiais
                        que
                        separamos para você.
                    </p>
                </div>
                <div class="info-card">
                    <img src="placeholder-icon-2.svg" alt="Card Icon 2">
                    <p class="card-description">
                        Clique em Sobre os materiais para conhecer as categorias de materiais que atendemos e suas
                        principais informações.
                    </p>
                </div>
            </div>

            <div class="icons-content"></div>

            <div class="option-btn-container">
                <button class="option-btn catalogue-btn">
                    <img src="placeholder-book-icon.svg" alt="C">
                    Catálogo virtual
                </button>
                <button class="option-btn about-material-btn">
                    <img src="placeholder-question-icon.svg" alt="A">
                    Sobre os materiais
                </button>
            </div>
        </div>
        <div class="container">
            <div class="icons-container">
                <div class="icons-content"></div>
            </div>
        </div>
    </main>
    <script src="menu.js"></script>
</body>

</html>
